name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  musl:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
      - run: cargo install --locked cargo-zigbuild
      - run: scripts/build-release.sh
      - name: Check the binaries are static
        run: |
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            file target/$t/release/gitagent | tee /dev/stderr | grep -q 'statically linked'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gitagent-linux
          path: target/*-unknown-linux-musl/release/gitagent

  clients:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p gitagent-cli
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python client
        run: GITAGENT_BIN=target/debug/gitagent python3 -m unittest discover -s clients/python/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: TypeScript client
        working-directory: clients/typescript
        run: npm install --no-audit --no-fund && npm run check
