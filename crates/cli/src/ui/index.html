<title>gitagent</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a narrow rail of views on the left, one main column with a status
   line at the bottom like a shell prompt, and a right-hand context panel
   where a view needs one. Dark first; everything is a line in a stream. */
:root{
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#0f1214; --panel:#151a1e; --raised:#1b2126; --line:#242c33; --line-strong:#334049;
  --fg:#d9e0e6; --muted:#8a96a1; --faint:#5d6973;
  --accent:#e2a93b; --accent-ink:#1a1407; --accent-soft:#e2a93b22;
  --ok:#5fb27a; --err:#d9655c; --ok-soft:#5fb27a1f; --err-soft:#d9655c1f;
  --sel:#e2a93b33;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f5f6f7; --panel:#ffffff; --raised:#eef0f2; --line:#dfe3e7; --line-strong:#c4cbd2;
    --fg:#1c2329; --muted:#5a656f; --faint:#8a949d;
    --accent:#a86d07; --accent-ink:#fff8ea; --accent-soft:#a86d0718;
    --ok:#2f8a4c; --err:#b9463d; --ok-soft:#2f8a4c18; --err-soft:#b9463d18;
    --sel:#a86d0733;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f5f6f7; --panel:#ffffff; --raised:#eef0f2; --line:#dfe3e7; --line-strong:#c4cbd2;
  --fg:#1c2329; --muted:#5a656f; --faint:#8a949d;
  --accent:#a86d07; --accent-ink:#fff8ea; --accent-soft:#a86d0718;
  --ok:#2f8a4c; --err:#b9463d; --ok-soft:#2f8a4c18; --err-soft:#b9463d18;
  --sel:#a86d0733;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:13px;line-height:1.55;
  display:flex;overflow:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:1px solid var(--line-strong);border-radius:4px;padding:3px 9px;color:var(--fg)}
button:hover{border-color:var(--accent);color:var(--accent)}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.primary:hover{opacity:.9;color:var(--accent-ink)}
button.quiet{border-color:transparent;color:var(--muted)}
button.quiet:hover{color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
a{color:var(--accent)}
.k{color:var(--muted)}
.dim{color:var(--faint)}
.ok{color:var(--ok)} .err{color:var(--err)} .acc{color:var(--accent)}

/* rail */
.rail{width:188px;min-width:188px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;
  padding-block:14px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:10px}
.brand{padding:4px 8px 12px;display:flex;flex-direction:column;gap:2px}
.brand b{font-weight:600;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.views{display:flex;flex-direction:column;gap:2px}
.view-btn{display:flex;align-items:center;gap:8px;padding:6px 8px;border:0;border-radius:4px;text-align:left;color:var(--muted);width:100%}
.view-btn:hover{color:var(--fg);background:var(--raised)}
.view-btn.on{color:var(--fg);background:var(--raised);box-shadow:inset 2px 0 0 var(--accent)}
.view-btn .key{margin-left:auto;color:var(--faint);font-size:11px}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:0 6px;font-size:11px;font-weight:600;min-width:17px;text-align:center}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:8px}
.rail-foot .meta{color:var(--faint);font-size:11px;line-height:1.5;word-break:break-all}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.head{height:40px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.head h1{font-size:13px;font-weight:600}
.head .sub{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .spacer{flex:1}
.body{flex:1;min-height:0;display:flex}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow:auto}
.pad{padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.status{height:30px;border-top:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));white-space:nowrap;overflow:hidden}
.status .pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status .pulse.on{background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.status .pulse.on{animation:none}}
.side{width:320px;min-width:320px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side.hidden{display:none}
.side h2,.tree-head{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 14px 6px}

/* stream */
.stream{display:flex;flex-direction:column;gap:2px;max-width:960px}
.row{display:grid;grid-template-columns:18px 1fr;gap:10px;padding:3px 0;align-items:start}
.row .mark{color:var(--faint);text-align:center;user-select:none}
.row.user .mark{color:var(--accent)}
.row.user .text{color:var(--fg);white-space:pre-wrap}
.row.agent .text{font-family:var(--sans);font-size:14px;line-height:1.6;max-width:72ch}
.row.agent .text p{margin:6px 0} .row.agent .text>*:first-child{margin-top:0} .row.agent .text>*:last-child{margin-bottom:0}
.row.agent .text ul,.row.agent .text ol{margin:6px 0;padding-left:22px}
.row.agent .text code{font-family:var(--mono);font-size:12.5px;background:var(--raised);padding:1px 5px;border-radius:3px}
.row.agent .text pre{background:var(--raised);border:1px solid var(--line);border-radius:4px;padding:10px 12px;overflow-x:auto;margin:8px 0}
.row.agent .text pre code{background:none;padding:0}
.row.agent .text h1,.row.agent .text h2,.row.agent .text h3{font-size:14px;font-weight:600;margin:10px 0 4px;text-wrap:balance}
.row.agent .text blockquote{border-left:2px solid var(--line-strong);padding-left:10px;color:var(--muted)}
.row.agent .text table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%}
.row.agent .text th,.row.agent .text td{border:1px solid var(--line);padding:4px 8px;text-align:left;font-size:13px}
.row.sys .text{color:var(--muted)}
.row.sys.err .text{color:var(--err)}
details.tool{display:contents}
details.tool>summary{display:grid;grid-template-columns:18px 1fr;gap:10px;padding:3px 0;list-style:none;cursor:pointer;color:var(--muted)}
details.tool>summary::-webkit-details-marker{display:none}
details.tool>summary .mark{color:var(--faint);text-align:center}
details.tool.running>summary .mark{color:var(--accent)}
details.tool.failed>summary .mark{color:var(--err)}
details.tool>summary .cmd{color:var(--fg);white-space:pre-wrap;word-break:break-word}
details.tool>summary .tail{color:var(--faint)}
details.tool .out{grid-column:2;margin-left:28px;border-left:1px solid var(--line);padding:4px 0 4px 12px;color:var(--muted);white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;font-size:12px}
.row.think .text{color:var(--faint);white-space:pre-wrap;font-size:12px}
.row.approval{background:var(--accent-soft);border-radius:4px;padding:8px 10px 8px 0;margin:4px 0}
.row.approval .mark{color:var(--accent);font-weight:600}
.row.approval .text{display:flex;flex-direction:column;gap:6px}
.row.approval .cmd{color:var(--fg);white-space:pre-wrap;word-break:break-word}
.row.approval .why{color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btns input{flex:1;min-width:160px;background:var(--bg);border:1px solid var(--line-strong);border-radius:4px;padding:3px 8px}
.row.result .text{color:var(--muted)}
.empty{color:var(--faint);padding:30px 0;max-width:60ch;line-height:1.7}
.empty b{color:var(--muted);font-weight:500}

/* composer */
.composer{border-top:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.composer .box{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:start;max-width:960px}
.composer .mark{color:var(--accent);padding-top:3px;text-align:center}
.composer textarea{background:transparent;border:0;outline:0;resize:none;width:100%;min-height:24px;max-height:200px;line-height:1.55;padding:3px 0}
.composer textarea::placeholder{color:var(--faint)}
.composer .hint{grid-column:2;color:var(--faint);font-size:11px;display:flex;gap:14px;flex-wrap:wrap}
.composer .hint kbd{color:var(--muted)}

/* tables and lists */
table.grid{border-collapse:collapse;width:100%;max-width:1100px}
table.grid th{text-align:left;color:var(--faint);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px 6px 0;border-bottom:1px solid var(--line)}
table.grid td{padding:7px 10px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.grid tr:hover td{background:var(--raised)}
table.grid td.actions{white-space:nowrap;text-align:right}
.pill{display:inline-block;border:1px solid var(--line-strong);border-radius:9px;padding:0 7px;font-size:11px;color:var(--muted)}
.pill.on{border-color:var(--ok);color:var(--ok)}
.pill.off{border-color:var(--line);color:var(--faint)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:var(--raised)}
.item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.on .t{color:var(--accent)}

/* agent view */
.tree{padding:4px 8px 14px;overflow:auto;flex:1;min-height:0}
.node{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:3px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.node:hover{background:var(--raised);color:var(--fg)}
.node.on{color:var(--accent);background:var(--raised)}
.node .chev{width:10px;color:var(--faint);display:inline-block}
.node.dir{color:var(--fg)}
.kids{margin-left:12px;border-left:1px solid var(--line);padding-left:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tab{border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 10px;color:var(--muted)}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.editor{flex:1;min-height:0;display:flex;flex-direction:column}
.editor .fmeta{display:flex;align-items:center;gap:12px;padding:8px 0;color:var(--muted);font-size:12px}
.editor .fmeta .spacer{flex:1}
.editor textarea{flex:1;min-height:200px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px;outline:0;resize:none;line-height:1.6;white-space:pre;overflow:auto;tab-size:2}
.editor textarea:focus{border-color:var(--line-strong)}
pre.doc{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;line-height:1.6;max-width:100ch}
.section{margin-bottom:16px}
.section h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:6px;display:flex;gap:10px;align-items:baseline}
.section h3 .k{text-transform:none;letter-spacing:0}
.diff{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow-x:auto;line-height:1.5;font-size:12.5px}
.diff .l{padding:0 12px;white-space:pre}
.diff .l.h{color:var(--accent);background:var(--accent-soft)}
.diff .l.hunk{color:var(--muted)}
.diff .l.add{background:var(--ok-soft);color:var(--ok)}
.diff .l.del{background:var(--err-soft);color:var(--err)}
.change{display:grid;grid-template-columns:72px 1fr auto;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:baseline}
.change:hover{background:var(--raised)}
.change.on .subject{color:var(--accent)}
.change .sha{color:var(--faint)}
.change .when{color:var(--faint);font-size:12px;white-space:nowrap}
.change .subject{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.change.working .sha{color:var(--accent)}

.toast{position:fixed;bottom:40px;right:max(16px,env(safe-area-inset-right,0px));background:var(--raised);border:1px solid var(--line-strong);border-radius:4px;padding:8px 12px;color:var(--fg);display:none;max-width:60ch}
.toast.on{display:block}
.demo-note{display:none;background:var(--accent-soft);color:var(--fg);border-bottom:1px solid var(--line);padding:6px 16px;font-size:12px}
.demo-note.on{display:block}
.only-narrow{display:none}
@media (max-width:760px){
  .rail{width:0;min-width:0;padding:0;overflow:hidden;border:0}
  .rail.open{position:fixed;inset:0 auto 0 0;width:220px;min-width:220px;z-index:20;padding-block:14px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:10px;box-shadow:0 0 0 100vmax #0008}
  .only-narrow{display:inline-flex}
  .side{position:fixed;inset:0 0 0 auto;width:min(320px,90vw);min-width:0;z-index:15}
  .row.agent .text{font-size:14px}
}
</style>

<div class="demo-note" id="demoNote">Preview with canned data: nothing here talks to a real agent. Type in the chat to see a scripted exchange.</div>
<nav class="rail" id="rail">
  <div class="brand"><b>gitagent</b><span id="agentName">…</span></div>
  <div class="views" id="views"></div>
  <div class="rail-foot">
    <div class="meta" id="railMeta"></div>
    <button class="quiet" id="themeBtn" title="Light or dark">theme</button>
  </div>
</nav>
<main class="main">
  <div class="head">
    <button class="quiet only-narrow" id="menuBtn" title="Views">≡</button>
    <h1 id="viewTitle">Chat</h1>
    <span class="sub" id="viewSub"></span>
    <span class="spacer"></span>
    <span id="headActions"></span>
  </div>
  <div class="body" id="body"></div>
  <div class="status" id="status"></div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEMO = !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
if (DEMO) $('#demoNote').classList.add('on');

// ── State ────────────────────────────────────────────────────────────────
const S = {
  view: 'chat', agent: {}, tools: [], skills: [], session: {id:'', status:'idle', costs:{}},
  rows: [], approvals: [], history: [], schedules: [], sessions: [], changes: {uncommitted:[], commits:[]},
  running: false, startedAt: 0, selected: {}, side: true,
};
const VIEWS = [
  ['chat','Chat','1'], ['agent','Agent','2'], ['approvals','Approvals','3'], ['schedules','Schedules','4'], ['sessions','Sessions','5'],
];

// ── Transport: the binary's HTTP API, or canned answers in the preview ───
async function api(path, body) {
  if (DEMO) return demoApi(path, body);
  const r = await fetch('/api/' + path, body === undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  if (!r.ok) throw new Error(path + ': ' + r.status + ' ' + (await r.text()));
  return r.json();
}
function listen() {
  if (DEMO) return;
  const es = new EventSource('/api/events');
  es.onmessage = ev => { try { onEvent(JSON.parse(ev.data)); } catch (_) {} };
  es.onerror = () => { setStatus(); };
}

// ── Events from the running session (the IPC protocol's messages) ────────
function onEvent(m) { reduce(S, m); if (m.type === 'schedule') refreshSchedules(); if (m.type === 'changes') refreshChanges(); render(); }
// Folds one protocol message into a transcript state (the live one, or a
// past session's).
function reduce(S, m) {
  const lastRow = (kind, create) => lastRowIn(S, kind, create);
  switch (m.type) {
    case 'user': S.rows.push({kind:'user', text:m.content}); S.running = true; S.startedAt = Date.now(); break;
    case 'delta': {
      if (m.deltaType === 'thinking') { const r = lastRow('think', true); r.text += m.content; }
      else { const r = lastRow('agent', true); r.text += m.content; }
      break;
    }
    case 'assistant': {
      const r = lastRow('agent', true); r.text = m.content || r.text; r.done = true;
      if (m.thinking) { const t = lastRow('think', false); if (t) t.text = m.thinking; }
      if (m.errorMessage) S.rows.push({kind:'sys', err:true, text:m.errorMessage});
      break;
    }
    case 'tool_use': S.rows.push({kind:'tool', id:m.toolCallId, name:m.toolName, args:m.args, out:null, error:false}); break;
    case 'tool_result': { const t = S.rows.find(r => r.kind==='tool' && r.id===m.toolCallId); if (t) { t.out = typeof m.content === 'string' ? m.content : JSON.stringify(m.content, null, 2); t.error = !!m.isError; } break; }
    case 'approval': {
      if (m.action === 'request') S.approvals.push({id:m.id, toolName:m.toolName, args:m.args, reason:m.reason, ts:m.ts});
      else { const i = S.approvals.findIndex(a => a.id===m.id); if (i>=0) { const a = S.approvals.splice(i,1)[0]; a.approved = m.approved; a.answer = m.reason; a.answeredAt = m.ts; S.history.unshift(a); } }
      S.rows.push({kind:'approval', id:m.id, toolName:m.toolName, args:m.args, reason:m.reason, pending:m.action==='request', approved:m.approved});
      if (m.action !== 'request') { const p = S.rows.find(r => r.kind==='approval' && r.id===m.id && r.pending); if (p) { p.pending=false; p.approved=m.approved; } S.rows.pop(); }
      break;
    }
    case 'system':
      if (m.subtype === 'turn_end') { S.running = false; if (m.metadata?.usage) addUsage(m.metadata.usage, S); const a = lastRow('agent', false); if (a) a.done = true; const t = lastRow('think', false); if (t) t.done = true; }
      else if (m.subtype === 'session_start') { S.session.id = m.metadata?.sessionId || S.session.id; }
      else if (m.subtype === 'session_end') { S.running = false; S.rows.push({kind:'sys', text:'session ended'}); }
      else if (m.subtype === 'ready') { S.tools = m.metadata?.tools || S.tools; }
      else if (m.subtype === 'hook_blocked' || m.subtype === 'warning' || m.subtype === 'error' || m.subtype === 'teardown') S.rows.push({kind:'sys', err:m.subtype==='error', text:(m.subtype==='teardown'?'teardown: ':'') + m.content});
      break;
    case 'schedule': S.rows.push({kind:'sys', text: m.action==='start' ? `schedule ${m.id} started` : `schedule ${m.id} ${m.success?'completed':'failed'}: ${m.result||''}`}); break;
    case 'changes': break;
    case 'status': S.running = !!m.running; break;
    default: break;
  }
}
function lastRowIn(S, kind, create) {
  for (let i = S.rows.length - 1; i >= 0; i--) {
    const r = S.rows[i];
    if (r.kind === 'user') break;
    if (r.kind === kind && !r.done) return r;
  }
  if (!create) return null;
  const r = {kind, text:'', done:false}; S.rows.push(r); return r;
}
function addUsage(u, S) {
  const c = S.session.costs || {};
  c.inputTokens = (c.inputTokens||0) + (u.inputTokens||0);
  c.outputTokens = (c.outputTokens||0) + (u.outputTokens||0);
  c.costUsd = (c.costUsd||0) + (u.costUsd||0);
  c.requests = (c.requests||0) + (u.requests||0);
  S.session.costs = c;
}

// ── Rendering ────────────────────────────────────────────────────────────
function render() {
  renderRail(); renderStatus();
  const title = VIEWS.find(v => v[0]===S.view)[1];
  $('#viewTitle').textContent = title;
  ({chat: renderChat, agent: renderAgent, approvals: renderApprovals, schedules: renderSchedules, sessions: renderSessions})[S.view]();
}
function renderRail() {
  $('#agentName').textContent = S.agent.name ? `${S.agent.name} · ${S.agent.dir || ''}` : '…';
  $('#agentName').title = S.agent.dir || '';
  const v = $('#views'); v.innerHTML = '';

function emptyChat() {

}
function rowHtml(r) {
  switch (r.kind) {
    case 'user': return `<div class="row user"><span class="mark">→</span><div class="text">${esc(r.text)}</div></div>`;
    case 'agent': return `<div class="row agent"><span class="mark">${r.done?'·':'…'}</span><div class="text">${md(r.text)}</div></div>`;
    case 'think': return `<details class="tool"><summary><span class="mark">∴</span><span class="cmd dim">reasoning</span></summary><div class="out">${esc(r.text)}</div></details>`;
    case 'tool': {
      const running = r.out === null;
      const cmd = toolLine(r.name, r.args);
      const tail = running ? '' : (r.error ? 'error' : firstLine(r.out));
      return `<details class="tool${running?' running':''}${r.error?' failed':''}" ${running?'open':''}><summary><span class="mark">${r.error?'✗':running?'▸':'$'}</span><span><span class="cmd">${esc(cmd)}</span>${tail?` <span class="tail">— ${esc(tail)}</span>`:''}</span></summary>${r.out!==null?`<div class="out">${esc(r.out)}</div>`:''}</details>`;
    }
    case 'approval': return `<div class="row approval" data-id="${esc(r.id)}"><span class="mark">!</span><div class="text"><span class="cmd">${esc(toolLine(r.toolName, r.args))}</span><span class="why">${esc(r.reason||'needs approval')}</span>` +
      (r.pending ? `<div class="btns"><button class="primary approve">approve</button><button class="deny">deny</button><input class="reason" placeholder="reason (optional)"></div>` : `<span class="${r.approved?'ok':'err'}">${r.approved?'approved':'denied'}</span>`) + `</div></div>`;
    case 'sys': return `<div class="row sys${r.err?' err':''}"><span class="mark">#</span><div class="text">${esc(r.text)}</div></div>`;
    default: return '';

}
function toolLine(name, args) {
  const a = args || {};
  if (name === 'cli' || name === 'exec') return 'cli ' + (a.command ?? a.cmd ?? '');
  if (name === 'read' || name === 'read_file') return 'read ' + (a.path ?? a.file_path ?? '');
  if (name === 'write' || name === 'write_file') return 'write ' + (a.path ?? a.file_path ?? '');
  if (name === 'edit' || name === 'str_replace') return 'edit ' + (a.path ?? '');
  if (name === 'memory') return 'memory ' + (a.action ?? '');
  const short = Object.entries(a).map(([k,v]) => `${k}=${typeof v==='string'?JSON.stringify(v):JSON.stringify(v)}`).join(' ');
  return name + (short ? ' ' + short : '');
}

  await api('send', {text});
}

// Helpers --------------------------------------------------------------------
function fmtTime(ts) { if (!ts) return ''; const d = new Date(ts); return isNaN(d) ? String(ts) : d.toLocaleString(undefined, {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}); }
let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
function md(src) {

  const lines = s.split('\n'); let html = ''; let i = 0;
  const isBlock = l => l.trim()==='' || /^#{1,6}\s/.test(l) || /^\s*[-*]\s/.test(l) || /^\s*\d+\.\s/.test(l) || /^&gt;/.test(l) || /^\u0000\d+\u0000$/.test(l.trim()) || /^\|/.test(l);
  while (i < lines.length) {
    const l = lines[i];
    if (/^\u0000\d+\u0000$/.test(l.trim())) { html += l.trim(); i++; continue; }
    let h = l.match(/^(#{1,6})\s+(.*)$/); if (h) { html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; i++; continue; }
    if (/^\|/.test(l)) { const rows = []; while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; } const cells = r => r.replace(/^\||\|$/g,'').split('|').map(c => inline(c.trim())); html += '<table>' + rows.filter(r => !/^\|[\s:-]+\|$/.test(r.replace(/\|/g,'|'))).filter(r => !/^[\s|:-]+$/.test(r)).map((r, k) => '<tr>' + cells(r).map(c => k===0 ? `<th>${c}</th>` : `<td>${c}</td>`).join('') + '</tr>').join('') + '</table>'; continue; }
    if (/^&gt;/.test(l)) { const b = []; while (i < lines.length && /^&gt;/.test(lines[i])) { b.push(lines[i].replace(/^&gt;\s?/, '')); i++; } html += `<blockquote>${inline(b.join(' '))}</blockquote>`; continue; }
    if (/^\s*[-*]\s+/.test(l)) { let b = ''; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { b += `<li>${inline(lines[i].replace(/^\s*[-*]\s+/, ''))}</li>`; i++; } html += `<ul>${b}</ul>`; continue; }
    if (/^\s*\d+\.\s+/.test(l)) { let b = ''; while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { b += `<li>${inline(lines[i].replace(/^\s*\d+\.\s+/, ''))}</li>`; i++; } html += `<ol>${b}</ol>`; continue; }
    if (l.trim() === '') { i++; continue; }
    const buf = []; while (i < lines.length && !isBlock(lines[i])) { buf.push(lines[i]); i++; }
