[package]
name = "ira"
version = "0.1.0"
edition = "2021"
description = "Ira — a git-native AI agent (faithful pi-core engine + gitagent-compatible SDK)"
license = "MIT"

[lib]
name = "ira"
path = "src/lib.rs"

[[bin]]
name = "ira"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "io-std", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
futures-util = "0.3"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tiny_http = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
getrandom = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
